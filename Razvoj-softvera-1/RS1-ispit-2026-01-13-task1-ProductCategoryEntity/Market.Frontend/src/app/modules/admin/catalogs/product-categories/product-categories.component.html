<div>
  <h1>Product Categories</h1>

  <!-- Filters -->
  <div>
    <label>
      <input
        type="checkbox"
        [(ngModel)]="showOnlyEnabled"
        (change)="onToggleEnabledFilter($event.target.checked)"
      />
      Only enabled
    </label>

    <input
      type="text"
      placeholder="Search..."
      [(ngModel)]="request.search"
      (keyup.enter)="onSearchChange(request.search || '')"
    />

    <button (click)="onCreate()">New Category</button>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading">
    <p>Loading...</p>
  </div>

  <!-- Error -->
  <div *ngIf="!isLoading && errorMessage">
    <p>{{ errorMessage }}</p>
  </div>

  <!-- Table -->
  <div *ngIf="!isLoading && !errorMessage">
    <table mat-table [dataSource]="items">
      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let category">{{ category.name }}</td>
      </ng-container>

      <!-- Is Enabled -->
      <ng-container matColumnDef="isEnabled">
        <th mat-header-cell *matHeaderCellDef>Active</th>
        <td mat-cell *matCellDef="let category">
          <mat-slide-toggle
            [checked]="category.isEnabled"
            (change)="onToggleStatus(category)"
            [disabled]="isLoading"
          >
            {{ category.isEnabled ? 'Yes' : 'No' }}
          </mat-slide-toggle>
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let category">
          <button (click)="onEdit(category)">Edit</button>
          <button (click)="onDelete(category)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <!-- No data -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">No data found.</td>
      </tr>
    </table>

    <app-fit-paginator-bar [vm]="this"></app-fit-paginator-bar>
  </div>
</div>
